services:
  energy-controller:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_PORT: "8080"
      DB_PATH: /app/data/energy.db
      FRONTEND_DIR: /app/frontend/out
      MOCK_MODE: ${MOCK_MODE:-true}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      ENABLE_REAL_CONTROL: ${ENABLE_REAL_CONTROL:-false}
      NATURE_MODE: ${NATURE_MODE:-cloud}
      NATURE_ACCESS_TOKEN: ${NATURE_ACCESS_TOKEN:-}
      NATURE_APPLIANCE_ID: ${NATURE_APPLIANCE_ID:-}
      NATURE_LOCAL_BASE_URL: ${NATURE_LOCAL_BASE_URL:-http://remo-e.local}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY:-}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY:-}
      ECOFLOW_DEVICE_SN: ${ECOFLOW_DEVICE_SN:-}
      ECOFLOW_BASE_URL: ${ECOFLOW_BASE_URL:-https://api-e.ecoflow.com}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      START_EXPORT_THRESHOLD_W: ${START_EXPORT_THRESHOLD_W:-700}
      STOP_EXPORT_THRESHOLD_W: ${STOP_EXPORT_THRESHOLD_W:-300}
      SAFETY_MARGIN_W: ${SAFETY_MARGIN_W:-150}
      MIN_CHARGE_W: ${MIN_CHARGE_W:-400}
      MAX_CHARGE_W: ${MAX_CHARGE_W:-1500}
      TARGET_SOC: ${TARGET_SOC:-90}
      MIN_COMMAND_INTERVAL_SEC: ${MIN_COMMAND_INTERVAL_SEC:-60}
      MIN_COMMAND_DIFF_W: ${MIN_COMMAND_DIFF_W:-100}
      REQUIRE_CONSECUTIVE_EXPORT_COUNT: ${REQUIRE_CONSECUTIVE_EXPORT_COUNT:-2}
      REQUIRE_CONSECUTIVE_IMPORT_COUNT: ${REQUIRE_CONSECUTIVE_IMPORT_COUNT:-2}
    volumes:
      - energy-data:/app/data
    restart: unless-stopped

volumes:
  energy-data:
