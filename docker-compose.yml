services:
  energy-controller:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_PORT: "8080"
      DB_PATH: /app/data/energy.db
      FRONTEND_DIR: /app/frontend/out
      MOCK_MODE: ${MOCK_MODE:-true}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      ENABLE_REAL_CONTROL: ${ENABLE_REAL_CONTROL:-false}
      AUTO_CONTROL_ENABLED: ${AUTO_CONTROL_ENABLED:-false}
      CONFIRM_ECOFLOW_WRITE: ${CONFIRM_ECOFLOW_WRITE:-}
      REAL_CONTROL_TRIAL_MINUTES: ${REAL_CONTROL_TRIAL_MINUTES:-0}
      REAL_CONTROL_TRIAL_UNTIL: ${REAL_CONTROL_TRIAL_UNTIL:-}
      NATURE_MODE: ${NATURE_MODE:-cloud}
      NATURE_ACCESS_TOKEN: ${NATURE_ACCESS_TOKEN:-}
      NATURE_APPLIANCE_ID: ${NATURE_APPLIANCE_ID:-}
      NATURE_LOCAL_BASE_URL: ${NATURE_LOCAL_BASE_URL:-http://remo-e.local}
      ECOFLOW_ACCESS_KEY: ${ECOFLOW_ACCESS_KEY:-}
      ECOFLOW_SECRET_KEY: ${ECOFLOW_SECRET_KEY:-}
      ECOFLOW_DEVICE_SN: ${ECOFLOW_DEVICE_SN:-}
      ECOFLOW_BASE_URL: ${ECOFLOW_BASE_URL:-https://api-e.ecoflow.com}
      ECOFLOW_DELTA3_READ_ENABLED: ${ECOFLOW_DELTA3_READ_ENABLED:-false}
      ECOFLOW_PRIVATE_API_HOST: ${ECOFLOW_PRIVATE_API_HOST:-api.ecoflow.com}
      ECOFLOW_PRIVATE_EMAIL: ${ECOFLOW_PRIVATE_EMAIL:-}
      ECOFLOW_PRIVATE_PASSWORD: ${ECOFLOW_PRIVATE_PASSWORD:-}
      ECOFLOW_DELTA3_DEVICE_SN: ${ECOFLOW_DELTA3_DEVICE_SN:-}
      ECOFLOW_DELTA3_DEVICE_TYPE: ${ECOFLOW_DELTA3_DEVICE_TYPE:-DELTA_3}
      ECOFLOW_DELTA3_MQTT_CLIENT_ID: ${ECOFLOW_DELTA3_MQTT_CLIENT_ID:-}
      ECOFLOW_DELTA3_TIMEOUT_SEC: ${ECOFLOW_DELTA3_TIMEOUT_SEC:-20}
      ECOFLOW_DELTA3_ALLOW_WRITE_WITH_AUTO_CONTROL: ${ECOFLOW_DELTA3_ALLOW_WRITE_WITH_AUTO_CONTROL:-false}
      ECOFLOW_DELTA3_EXECUTE: ${ECOFLOW_DELTA3_EXECUTE:-false}
      ECOFLOW_DELTA3_ALLOW_PRIVATE_API_WRITE: ${ECOFLOW_DELTA3_ALLOW_PRIVATE_API_WRITE:-false}
      DELTA3_AUX_ENABLED: ${DELTA3_AUX_ENABLED:-false}
      DELTA3_AUX_MIN_CHARGE_W: ${DELTA3_AUX_MIN_CHARGE_W:-100}
      DELTA3_AUX_MAX_CHARGE_W: ${DELTA3_AUX_MAX_CHARGE_W:-1500}
      DELTA3_AUX_SAFETY_MARGIN_W: ${DELTA3_AUX_SAFETY_MARGIN_W:-50}
      DELTA3_AUX_MIN_COMMAND_DIFF_W: ${DELTA3_AUX_MIN_COMMAND_DIFF_W:-100}
      DELTA3_AUX_MAX_INCREASE_STEP_W: ${DELTA3_AUX_MAX_INCREASE_STEP_W:-300}
      DELTA3_AUX_MAX_DECREASE_STEP_W: ${DELTA3_AUX_MAX_DECREASE_STEP_W:-500}
      DELTA3_AUX_MIN_COMMAND_INTERVAL_SEC: ${DELTA3_AUX_MIN_COMMAND_INTERVAL_SEC:-120}
      DELTA3_AUX_STOP_IMPORT_THRESHOLD_W: ${DELTA3_AUX_STOP_IMPORT_THRESHOLD_W:-50}
      DELTA3_AUX_TARGET_MAX_SOC_BUFFER_PERCENT: ${DELTA3_AUX_TARGET_MAX_SOC_BUFFER_PERCENT:-2}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      START_EXPORT_THRESHOLD_W: ${START_EXPORT_THRESHOLD_W:-700}
      STOP_EXPORT_THRESHOLD_W: ${STOP_EXPORT_THRESHOLD_W:-300}
      SAFETY_MARGIN_W: ${SAFETY_MARGIN_W:-150}
      MIN_CHARGE_W: ${MIN_CHARGE_W:-400}
      MAX_CHARGE_W: ${MAX_CHARGE_W:-1500}
      TARGET_SOC: ${TARGET_SOC:-90}
      MIN_COMMAND_INTERVAL_SEC: ${MIN_COMMAND_INTERVAL_SEC:-60}
      MIN_COMMAND_DIFF_W: ${MIN_COMMAND_DIFF_W:-100}
      EFFECTIVE_CHARGE_THRESHOLD_W: ${EFFECTIVE_CHARGE_THRESHOLD_W:-100}
      TARGET_EXPORT_BUFFER_W: ${TARGET_EXPORT_BUFFER_W:-150}
      MAX_INCREASE_STEP_W: ${MAX_INCREASE_STEP_W:-400}
      MAX_DECREASE_STEP_W: ${MAX_DECREASE_STEP_W:-600}
      RESERVE_RAISE_STEP_PERCENT: ${RESERVE_RAISE_STEP_PERCENT:-2}
      DEFAULT_RESERVE_SOC: ${DEFAULT_RESERVE_SOC:-30}
      PASS_THROUGH_ENABLED: ${PASS_THROUGH_ENABLED:-false}
      PASS_THROUGH_COOLDOWN_SEC: ${PASS_THROUGH_COOLDOWN_SEC:-300}
      REQUIRE_CONSECUTIVE_EXPORT_COUNT: ${REQUIRE_CONSECUTIVE_EXPORT_COUNT:-2}
      REQUIRE_CONSECUTIVE_IMPORT_COUNT: ${REQUIRE_CONSECUTIVE_IMPORT_COUNT:-2}
    volumes:
      - energy-data:/app/data
    restart: unless-stopped

volumes:
  energy-data:
